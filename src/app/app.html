<mat-toolbar color="primary" class="toolbar">
  <span>Sistema Help Desk</span>
</mat-toolbar>

<mat-sidenav-container class="layout">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="menu-titulo">Menú Principal</div>
      <a mat-list-item routerLink="/dashboard"
      routerLinkActive="activo">
        <mat-icon matListItemIcon>dashboard</mat-icon>  
        <span matListItemTitle>Dashboard</span>
    </a>

    <a mat-list-item routerLink="/tickets"
      routerLinkActive="activo">
        <mat-icon matListItemIcon>confirmation_number</mat-icon>  
        <span matListItemTitle>Tickets</span>
    </a>

    <a mat-list-item routerLink="/kanban"
      routerLinkActive="activo">
        <mat-icon matListItemIcon>view_kanban</mat-icon>  
        <span matListItemTitle>Kanban</span>
    </a>

    <a mat-list-item routerLink="/reportes"
      routerLinkActive="activo">
        <mat-icon matListItemIcon>bar_chart</mat-icon>  
        <span matListItemTitle>Reportes</span>
    </a>

    <a mat-list-item routerLink="/usuarios"
      routerLinkActive="activo">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Usuarios</span>
    </a>

    <a mat-list-item routerLink="/acerca-de"
      routerLinkActive="activo">
        <mat-icon matListItemIcon>info</mat-icon>
        <span matListItemTitle>Acerca de</span>
    </a>
  </mat-sidenav>
    
<mat-sidenav-content>
  <main class="contenedor">
    <router-outlet></router-outlet>
  </main>
</mat-sidenav-content>

</mat-sidenav-container>
