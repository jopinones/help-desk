<section class="columna">
  <header class="columna-encabezado">
    <h2>{{ titulo() }}</h2>
    <span class="cantidad">{{ tickets().length }}</span>
  </header>
  <!-- La zona conserva altura aunque la columna no tenga tickets. El orden sigue siendo por fecha. -->
  <div
    class="columna-contenido"
    cdkDropList
    [cdkDropListData]="tickets()"
    [cdkDropListDisabled]="actualizando()"
    [cdkDropListSortingDisabled]="true"
    (cdkDropListDropped)="soltarTicket($event)"
  >
    @for (ticket of tickets(); track ticket.id) {
      <div
        class="tarjeta-arrastrable"
        cdkDrag
        [cdkDragData]="ticket"
        [cdkDragDisabled]="actualizando()"
      >
        <!-- El asa evita iniciar arrastres al usar el enlace o el selector de estado. -->
        <button
          type="button"
          class="asa-arrastre"
          cdkDragHandle
          [disabled]="actualizando()"
          [attr.aria-label]="'Arrastrar ticket #' + ticket.id"
        >
          Mover ticket
        </button>
        <app-tarjeta-ticket
          [ticket]="ticket"
          [actualizando]="actualizando()"
          (cambiarEstado)="cambiarEstado.emit($event)"
        />
      </div>
    } @empty {
      <p class="mensaje-vacio">No hay tickets registrados</p>
    }
  </div>
</section>
