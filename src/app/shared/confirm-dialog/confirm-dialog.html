<div class="dialogo">
    <div class="icono">
        <mat-icon>warning_amber</mat-icon>
    </div>
 
    <h2 mat-dialog-title>
        {{ data.titulo }}
    </h2>
 
    <mat-dialog-content>
        <p>
            {{ data.mensaje }}
        </p>
    </mat-dialog-content>
 
    <mat-dialog-actions align="center">
        <button mat-stroked-button type="button" (click)="cancelar()">
            {{ data.textoCancelar ?? 'Cancelar' }}
        </button>
 
        <!-- CORRECCIÓN: faltaba class="confirmar"; sin ella el botón no tomaba el color rojo
             definido en el SCSS, y una acción destructiva debe distinguirse. -->
        <button mat-flat-button type="button" class="confirmar" (click)="confirmar()">
            {{ data.textoConfirmar ?? 'Confirmar' }}
        </button>
    </mat-dialog-actions>
</div>
