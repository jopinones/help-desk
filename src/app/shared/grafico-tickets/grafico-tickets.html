<article class="panel">
    <h3>{{ titulo() }}</h3>
    <svg class="lienzo" viewBox="0 0 240 180" role="img" [attr.aria-label]="titulo()">
        @if (tipo() === 'bar') {
            <line class="base" x1="16" y1="156" x2="224" y2="156" />
            @for (serie of series(); track serie.etiqueta; let indice = $index) {
                @let alto = (serie.cantidad / maximo()) * 116;
                @let centro = 16 + ((indice + 0.5) * 208) / series().length;

                <!-- CORRECCIÓN: el <text> estaba DENTRO del <rect>; en SVG un rect no admite
                     hijos, así que la cantidad nunca se veía. Ahora rect y text son hermanos
                     dentro de un <g>, que además agrupa el resaltado al pasar el puntero. -->
                <g
                    [class.atenuado]="activa() && activa() !== serie.etiqueta"
                    (pointerenter)="activa.set(serie.etiqueta)"
                    (pointerleave)="activa.set(null)"
                >
                    <rect
                        [attr.x]="centro - 19"
                        [attr.y]="156 - alto"
                        width="38"
                        [attr.height]="alto"
                        rx="4"
                        [attr.fill]="serie.color"
                    />
                    <text
                        [attr.x]="centro"
                        [attr.y]="148 - alto"
                        text-anchor="middle"
                    >
                        {{ serie.cantidad }}
                    </text>
                </g>
            }
        }
        @else if (tipo() === 'line') {
            <!-- AGREGADO: gráfico de líneas. Una polilínea une los puntos; cada punto es un
                 círculo con puntero/foco para ver su detalle (igual que barras y anillo).
                 Los círculos llevan tabindex para poder recorrerlos con el teclado. -->
            <line class="base" x1="16" y1="156" x2="232" y2="156" />
            <polyline
                class="linea"
                fill="none"
                stroke-width="2.5"
                stroke-linejoin="round"
                stroke-linecap="round"
                [attr.stroke]="colorLinea()"
                [attr.points]="trazado()" />
            @for (punto of puntos(); track punto.etiqueta) {
                <g
                    [class.atenuado]="activa() && activa() !== punto.etiqueta"
                    (pointerenter)="activa.set(punto.etiqueta)"
                    (pointerleave)="activa.set(null)"
                >
                    <circle
                        class="punto"
                        tabindex="0"
                        r="4"
                        [attr.cx]="punto.x"
                        [attr.cy]="punto.y"
                        [attr.fill]="punto.color"
                        [attr.aria-label]="punto.etiqueta + ': ' + punto.cantidad + ' tickets'"
                        (focus)="activa.set(punto.etiqueta)"
                        (blur)="activa.set(null)" />
                    @if (punto.mostrarCantidad || activa() === punto.etiqueta) {
                        <text [attr.x]="punto.x" [attr.y]="punto.y - 9" text-anchor="middle">
                            {{ punto.cantidad }}
                        </text>
                    }
                    @if (punto.mostrarEje) {
                        <text class="eje" [attr.x]="punto.x" y="172" text-anchor="middle">
                            {{ punto.etiquetaCorta ?? punto.etiqueta }}
                        </text>
                    }
                </g>
            }
        }
        @else {
            @for (segmento of segmentos(); track segmento.etiqueta) {
                @if (segmento.longitud > 0) {
                    <!-- CORRECCIÓN: stroke-dashoffset debe ser NEGATIVO para avanzar el segmento
                         a lo largo del anillo; con el valor positivo los segmentos se
                         superponían en el orden equivocado. También: `activa !== ...` no tenía
                         paréntesis (comparaba la función del signal) y la clase tenía typos. -->
                    <circle
                        cx="120"
                        cy="90"
                        r="62"
                        pathLength="100"
                        fill="none"
                        stroke-width="24"
                        transform="rotate(-90 120 90)"
                        [attr.stroke]="segmento.color"
                        [attr.stroke-dasharray]="segmento.longitud + ' ' + (100 - segmento.longitud)"
                        [attr.stroke-dashoffset]="-segmento.inicio"
                        [class.atenuado]="activa() && activa() !== segmento.etiqueta"
                        (pointerenter)="activa.set(segmento.etiqueta)"
                        (pointerleave)="activa.set(null)" />
                }
            }

            <text
                x="120"
                y="90"
                text-anchor="middle"
                dominant-baseline="central"
                class="total"
            >
                {{ total() }}
            </text>
        }

    </svg>

    <p class="detalle" aria-live="polite">
        @if (detalle(); as serie) {
            {{ serie.etiqueta }} - {{ serie.cantidad }} tickets - {{ porcentaje(serie.cantidad) }}
        }
        @else {
            Explora una categoría para ver su proporción
        }
    </p>

    <!-- CAMBIO: en el gráfico de líneas no se muestra la lista (podría tener decenas de días);
         el detalle del punto activo aparece en el párrafo de arriba. -->
    @if (tipo() !== 'line') {
    <ul>
        <!-- CORRECCIÓN: `@for (serie in series())` no existe en Angular; la sintaxis es `of`. -->
        @for (serie of series(); track serie.etiqueta) {
            <li>
                <button
                    type="button"
                    (focus)="activa.set(serie.etiqueta)"
                    (blur)="activa.set(null)"
                    (click)="activa.set(serie.etiqueta)"
                >
                    <span class="muestra" [style.background]="serie.color" aria-hidden="true"></span>
                    <span>{{ serie.etiqueta }}</span>
                    <strong>{{ serie.cantidad }}</strong>
                </button>
            </li>
        }
    </ul>
    }
</article>
